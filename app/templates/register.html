{% extends 'base.html' %}
{% block title %}Create account · ParkSmart{% endblock %}
{% block content %}
<div class="auth"><div class="text-center mb-4"><span class="icon-box green mb-3">🚗</span><h1 class="h3">Create your driver account</h1><p class="text-secondary mb-0">Save your vehicle details for quick reservations and entry.</p></div><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" autocomplete="name" required maxlength="100"><label class="form-label">Email address</label><input class="form-control mb-3" name="email" type="email" autocomplete="email" required><label class="form-label">Vehicle number</label><input class="form-control mb-3" name="vehicle_number" placeholder="TN 00 AB 0000" maxlength="30" required><label class="form-label">Password</label><input class="form-control mb-3" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="btn btn-primary w-100">Create account <span aria-hidden="true">→</span></button></form><p class="mt-4 mb-0 text-center text-secondary">Already registered? <a href="{{ url_for('main.login') }}">Sign in</a></p></div>
{% endblock %}
